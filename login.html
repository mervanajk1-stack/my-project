<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | ᴿᴱˣ TEAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --black:#000;--black-2:#0a0a0a;--black-3:#121212;--black-4:#1a1a1a;
      --white:#fff;--dim:#a0a0a0;--faint:#666;
      --border:rgba(255,255,255,.1);--border-2:rgba(255,255,255,.2);
      --danger:#ff5555;--success:#7dffb2;--accent:#4da6ff;--cyan:#63ded1;
    }
    html,body{min-height:100%;font-family:'Outfit',sans-serif;background:var(--black);color:var(--white)}
    body{
      min-height:100vh;
      background:
        radial-gradient(ellipse at 7% 0%, rgba(58,101,90,.16), transparent 35%),
        radial-gradient(ellipse at 100% 42%, rgba(80,70,126,.10), transparent 31%),
        linear-gradient(160deg, #0a1015 0%, #070b10 62%, #090d12 100%);
    }
    button,input{font:inherit}
    .auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .auth-card{
      width:min(100%,440px);padding:34px 30px 26px;
      background:linear-gradient(145deg, rgba(18,27,35,.98), rgba(9,14,19,.98));
      border:1px solid var(--border-2);border-radius:24px;
      box-shadow:0 25px 90px rgba(0,0,0,.42);
      animation:rise .45s ease;
    }
    .brand-mark{
      width:62px;height:62px;margin:0 auto 14px;display:grid;place-items:center;
      border-radius:16px;
      background:linear-gradient(145deg, #7ab8ff, #4da6ff);
      color:#0b1015;font-size:27px;
      box-shadow:0 7px 24px rgba(77,166,255,.16);
      cursor:pointer;
    }
    .eyebrow{text-align:center;color:var(--accent);font:700 10px 'JetBrains Mono',monospace;letter-spacing:1.2px}
    .auth-card h1{text-align:center;margin-top:9px;font-size:25px;font-weight:900;letter-spacing:-.4px}
    .subtitle{text-align:center;margin:6px 0 24px;color:var(--dim);font-size:13px}
    .field{margin-bottom:14px}
    .field label{display:block;margin-bottom:6px;color:var(--dim);font-size:11px;font-weight:800;letter-spacing:.7px}
    .input-wrap{
      display:flex;align-items:center;gap:10px;padding:0 13px;
      border:1px solid var(--border);border-radius:12px;background:#090f14;
      transition:border-color .2s;
    }
    .input-wrap:focus-within{border-color:var(--accent)}
    .input-wrap>i{color:var(--cyan);font-size:13px}
    .input-wrap input{
      width:100%;padding:13px 0;border:0;outline:0;background:transparent;
      color:var(--white);font-size:14px;
    }
    .input-wrap input::placeholder{color:#758580}
    .toggle-password{border:0;background:transparent;color:var(--dim);cursor:pointer;padding:5px}
    .form-message{min-height:18px;text-align:center;font-size:12px;font-weight:700;color:var(--danger);margin-bottom:4px}
    .form-message.success{color:var(--success)}
    .submit-btn{
      width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
      padding:14px;border:0;border-radius:12px;
      background:var(--accent);color:#0b1015;cursor:pointer;
      font-size:14px;font-weight:900;transition:all .2s;
      box-shadow:0 8px 24px rgba(77,166,255,.12);
    }
    .submit-btn:hover{background:#7ab8ff;transform:translateY(-1px)}
    .submit-btn:disabled{opacity:.6;cursor:wait;transform:none}
    .account-note{
      margin-top:20px;padding-top:16px;border-top:1px solid var(--border);
      text-align:center;color:var(--dim);font-size:11px;line-height:1.7;
    }
    .account-note i{margin-right:6px;color:var(--cyan)}
    .back-link{
      display:inline-flex;align-items:center;gap:6px;margin-top:14px;
      color:var(--dim);font-size:12px;font-weight:700;
    }
    .back-link:hover{color:var(--accent)}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @media(max-width:480px){.auth-shell{padding:14px}.auth-card{padding:28px 20px 22px}}
  </style>
</head>
<body>

<main class="auth-shell">
  <section class="auth-card">
    <a class="brand-mark" href="/" title="Back to home"><i class="fa-solid fa-bolt"></i></a>
    <p class="eyebrow">ᴿᴱˣ TEAM / LEVEL UP BOT</p>
    <h1>Sign In</h1>
    <p class="subtitle">Access your control panel</p>

    <form method="POST" action="/login{% if next %}?next={{ next }}{% endif %}" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <i class="fa-regular fa-user"></i>
          <input id="username" name="username" type="text" minlength="3" maxlength="32"
                 autocomplete="username" placeholder="Enter your username" required>
        </div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input id="password" name="password" type="password" minlength="4"
                 autocomplete="current-password" placeholder="Enter your password" required>
          <button class="toggle-password" type="button" aria-label="Show password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>
      <p class="form-message" id="form-message">{{ error or "" }}</p>
      <button class="submit-btn" type="submit">
        <span>Sign In</span><i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <p class="account-note">
      <i class="fa-solid fa-circle-info"></i> Accounts are created by the administrator only.
    </p>
    <div style="text-align:center">
      <a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i> Back to home</a>
    </div>
  </section>
</main>

<script>
  document.querySelector('.toggle-password')?.addEventListener('click', function(){
    const pw = document.getElementById('password');
    const t = pw.getAttribute('type') === 'password' ? 'text' : 'password';
    pw.setAttribute('type', t);
    this.innerHTML = t === 'password'
      ? '<i class="fa-regular fa-eye"></i>'
      : '<i class="fa-regular fa-eye-slash"></i>';
  });
</script>

</body>
</html>
